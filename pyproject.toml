[project]
name = "bmh"
version = "2.0.0"
description = "Purely interactive CLI companion and structured card inspector for Basic Memory (bm)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Syafiq", email = "syafiq@syafiqkay.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
bmh = "bmh.main:cli_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
